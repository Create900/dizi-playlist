name: Update M3U Playlist

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Generate M3U Playlist
        run: python generate.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add diziler.m3u

          # Eğer sahnelenmiş değişiklik yoksa çık
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Remote ile senkronize ol—non-fast-forward hatalarını azaltır
          git fetch origin main
          git rebase origin/main || git pull --rebase origin main || true

          git commit -m "Auto update M3U playlist"
          # remote ana branch'i koruyarak push et (force-with-lease daha güvenli)
          git push --force-with-lease origin HEAD:main
